version: '3.8'

networks:
  kafka-net:
    driver: bridge
  n8n-compose_default:
    external: true

services:
  kafka1:
    image: confluentinc/cp-kafka:7.8.0
    hostname: kafka1
    container_name: kafka1
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - "9092:9092"
      - "9093:9093"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_BROKER_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka1:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://kafka1:9093,EXTERNAL://0.0.0.0:9094'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka1:9092,EXTERNAL://localhost:9094'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      CLUSTER_ID: 'EmptNWtoR4GGWx-BH6nGLQ'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
    volumes:
      - ./kafka1/data:/var/lib/kafka/data
    networks:
      - kafka-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-cluster-ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:9092
    depends_on:
      - kafka1
    networks:
      - kafka-net

  postgres:
    image: postgres:16
    container_name: bbw-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: bbw_user
      POSTGRES_PASSWORD: bbw_password
      POSTGRES_DB: bbw_metadata
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    networks:
      - kafka-net

  producer:
    image: 477056345538.dkr.ecr.eu-central-1.amazonaws.com/bbw-app:latest
    container_name: bbw-producer
    env_file: .env
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka1:9092
      PYTHONUNBUFFERED: "1"
    command: uv run producers/produce_nextbike.py
    depends_on:
      - kafka1
    networks:
      - kafka-net

  consumer:
    image: 477056345538.dkr.ecr.eu-central-1.amazonaws.com/bbw-app:latest
    container_name: bbw-consumer
    env_file: .env
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka1:9092
      PYTHONUNBUFFERED: "1"
    command: uv run consumers/consume_nextbike.py
    depends_on:
      - kafka1
    networks:
      - kafka-net

  loader:
    image: 477056345538.dkr.ecr.eu-central-1.amazonaws.com/bbw-app:latest
    container_name: bbw-loader
    env_file: .env
    restart: unless-stopped
    environment:
      POSTGRES_HOST: bbw-postgres
      PYTHONUNBUFFERED: "1"
    command: uv run loaders/load_to_redshift.py
    depends_on:
      - postgres
    networks:
      - kafka-net

  dashboard:
    image: 477056345538.dkr.ecr.eu-central-1.amazonaws.com/bbw-app:latest
    container_name: bbw-dashboard
    env_file: .env
    restart: unless-stopped
    command: uv run streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true
    labels:
      - traefik.enable=true
      - traefik.http.routers.bbw.rule=Host(`bbw.empathyminds.club`)
      - traefik.http.routers.bbw.tls=true
      - traefik.http.routers.bbw.entrypoints=web,websecure
      - traefik.http.routers.bbw.tls.certresolver=mytlschallenge
      - traefik.http.services.bbw.loadbalancer.server.port=8501
      - traefik.docker.network=n8n-compose_default
    networks:
      - kafka-net
      - n8n-compose_default